[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-first-agent"
version = "0.1.0"
description = "A local-first autonomous AI software engineering agent MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent = "local_agent.cli:main"
agent-ui = "local_agent.ui:main"

[tool.setuptools.packages.find]
include = ["local_agent*"]
